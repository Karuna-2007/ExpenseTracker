<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>💸 Expense Tracker</h1>
    
    <!-- Total Balance Card -->
    <div class="balance-card">
      <h3>Total Balance</h3>
      <h2 id="balance">₹0</h2>
      <div class="income-expense">
        <div>
          <h4>Income</h4>
          <p id="money-plus" class="money plus">+₹0</p>
        </div>
        <div>
          <h4>Expense</h4>
          <p id="money-minus" class="money minus">-₹0</p>
        </div>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <h3>Add New Transaction</h3>
    <form id="form">
      <input type="text" id="text" placeholder="Kis cheez ka kharcha? e.g. Maggi" required>
      <input type="number" id="amount" placeholder="Amount: -500 ya +1000" required>
      <small>Expense ke liye minus: -500, Income ke liye: 1000</small>
      <button class="btn">Add Transaction</button>
    </form>

    <!-- Chart -->
    <h3>Expense Breakdown</h3>
    <canvas id="myChart"></canvas>

    <!-- History -->
    <h3>History</h3>
    <ul id="list" class="list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
